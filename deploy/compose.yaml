services:
  nexus-prime-web:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
      args:
        VITE_DOCKER_API_URL: ${VITE_DOCKER_API_URL:-/api/docker/containers}
        VITE_DOCKER_STATS_URL: ${VITE_DOCKER_STATS_URL:-/api/docker/stats}
    expose:
      - "80"
    depends_on:
      - nexus-prime-api
    networks:
      - web-api
    restart: unless-stopped

  nexus-prime-api:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    environment:
      API_HOST: 0.0.0.0
      API_PORT: "3001"
      API_ALLOW_REMOTE: "true"
      DOCKER_HOST: tcp://nexus-prime-docker-proxy:2375
    expose:
      - "3001"
    depends_on:
      - nexus-prime-docker-proxy
    networks:
      - web-api
      - api-docker
    restart: unless-stopped

  nexus-prime-docker-proxy:
    image: ${DOCKER_SOCKET_PROXY_IMAGE:?Set DOCKER_SOCKET_PROXY_IMAGE to an approved pinned image or digest}
    environment:
      CONTAINERS: "1"
      POST: "0"
      AUTH: "0"
      BUILD: "0"
      COMMIT: "0"
      CONFIGS: "0"
      DISTRIBUTION: "0"
      EXEC: "0"
      IMAGES: "0"
      INFO: "0"
      NETWORKS: "0"
      NODES: "0"
      PLUGINS: "0"
      SERVICES: "0"
      SESSION: "0"
      SWARM: "0"
      SYSTEM: "0"
      TASKS: "0"
      VOLUMES: "0"
    volumes:
      - ${DOCKER_SOCKET_PATH:-/var/run/docker.sock}:/var/run/docker.sock:ro
    networks:
      - api-docker
    restart: unless-stopped

networks:
  web-api:
  api-docker:
    internal: true

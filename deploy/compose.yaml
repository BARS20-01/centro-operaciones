# Coolify Git: Base Directory=/deploy, Docker Compose Location=/compose.yaml.
# Each context is the repository root, not the frontend or backend directory.
services:
  nexus-prime-web:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
      args:
        VITE_DOCKER_API_URL: ${VITE_DOCKER_API_URL:-/api/docker/containers}
        VITE_DOCKER_STATS_URL: ${VITE_DOCKER_STATS_URL:-/api/docker/stats}
    expose:
      - "80"
    depends_on:
      nexus-prime-api:
        condition: service_healthy
    networks:
      - web-api
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  nexus-prime-api:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    environment:
      API_HOST: 0.0.0.0
      API_PORT: "3001"
      API_ALLOW_REMOTE: "true"
      DOCKER_HOST: tcp://nexus-prime-docker-proxy:2375
    expose:
      - "3001"
    depends_on:
      - nexus-prime-docker-proxy
    networks:
      - web-api
      - api-docker
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3001/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  nexus-prime-docker-proxy:
    image: ${DOCKER_SOCKET_PROXY_IMAGE:-ghcr.io/tecnativa/docker-socket-proxy@sha256:1f5038b54f06c3e18422902cf00ba21803d1c97805aae032e5e6673d532d3459}
    environment:
      CONTAINERS: "1"
      VERSION: "1"
      PING: "1"
      POST: "0"
      AUTH: "0"
      BUILD: "0"
      COMMIT: "0"
      CONFIGS: "0"
      DISTRIBUTION: "0"
      EVENTS: "0"
      EXEC: "0"
      GRPC: "0"
      IMAGES: "0"
      INFO: "0"
      NETWORKS: "0"
      NODES: "0"
      PLUGINS: "0"
      SERVICES: "0"
      SECRETS: "0"
      SESSION: "0"
      SWARM: "0"
      SYSTEM: "0"
      TASKS: "0"
      VOLUMES: "0"
      ALLOW_START: "0"
      ALLOW_STOP: "0"
      ALLOW_RESTARTS: "0"
      ALLOW_PAUSE: "0"
      ALLOW_UNPAUSE: "0"
    volumes:
      - ${DOCKER_SOCKET_PATH:-/var/run/docker.sock}:/var/run/docker.sock:ro
    networks:
      - api-docker
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2375/_ping"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  web-api:
  api-docker:
    internal: true
